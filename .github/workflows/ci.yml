name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:types

  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The integration jobs need a dbus-daemon binary on PATH; the tests
      # start their own private bus rather than using the system one.
      - name: Install dbus (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus

      - name: Install dbus (macOS)
        if: runner.os == 'macOS'
        run: brew install dbus

      - run: npm ci
      - run: npm run test:raw
      - run: npm run test:integration

  broker:
    # The full integration suite against the in-process broker: no daemon, no OS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration:broker

  cross-runtime:
    name: cross-runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: node scripts/smoke.mjs
      - run: bun scripts/smoke.mjs
      - run: deno run -A scripts/smoke.mjs
